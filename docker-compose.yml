# Docker Compose for FitMeLegal Platform
#
# Development: docker-compose up -d
# Production: docker-compose -f docker-compose.prod.yml up -d
#
# For local development, you can also use local PostgreSQL/Redis
# and update apps/api/.env with your credentials

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fitmelegal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitmelegal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitmelegal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-fitmelegal_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fitmelegal}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitmelegal-network

  # Redis (for caching and sessions)
  redis:
    image: redis:7-alpine
    container_name: fitmelegal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitmelegal-network

networks:
  fitmelegal-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
